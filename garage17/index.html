<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="description" content="Онлайн-клуб, где ребята 13-17 лет с ИИ делают сайты, ботов, дизайн и свои проекты. Бесплатный пробный урок."><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Гараж17: клуб для подростков 13-17 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&family=Manrope:wght@400..800&family=Rubik+Spray+Paint&display=swap">
<style>
:root{
  --ground:#111214;--panel:#1A1C21;--panel2:#22252B;--ink:#F4F2EC;--muted:#A6ABB5;
  --lime:#C6F135;--lime-ink:#111214;--line:#2C2F36;--hot:#FF5FA2;
  --display:'Unbounded','Arial Black',Arial,sans-serif;
  --body:'Manrope','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
body[data-v="mama"]{--hot:#FFB84D}
body[data-v="teen"]{--hot:#FF5FA2}
body[data-v="abroad"]{--hot:#5CD3FF}
body[data-v="founder"]{--hot:#FF7A45}
body[data-v="future"]{--hot:#B79CFF}
body[data-v="quit"]{--hot:#FFE14D}
body[data-v="status"]{--hot:#3DDC97}
body[data-v="rebel"]{--hot:#FF4D4D}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.55 var(--body);padding-inline:16px;padding-block:0 96px}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(28px,4.4vw,48px);line-height:1.08;font-weight:800}
h3{font-size:20px;line-height:1.2;font-weight:700}
p{margin:0}
.eyebrow{font:800 13px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.lead{color:var(--muted);font-size:19px;max-width:60ch}
section{padding-block:72px 0}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:36px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 17px/1.1 var(--body);text-decoration:none;border:0;cursor:pointer;border-radius:14px;padding:20px 28px;transition:transform .15s ease,box-shadow .15s ease;text-align:center}
.btn-lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 6px 0 #8FB31A}
.btn-lime:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8FB31A}
.btn-lime:active{transform:translateY(4px);box-shadow:0 2px 0 #8FB31A}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(17,18,20,.9);backdrop-filter:blur(10px);margin-inline:-16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:inline-flex;align-items:center;text-decoration:none;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;flex:0 0 auto}
.logo b{font:800 22px/1 var(--display);letter-spacing:-.03em;font-style:italic;transform:skewX(-8deg);display:inline-block;text-shadow:2px 2px 0 var(--hot)}
.logo i{font:400 24px/1 'Rubik Spray Paint',var(--display);font-style:normal;background:var(--lime);color:var(--lime-ink);padding:6px 10px 4px;border-radius:46% 38% 52% 34%;transform:rotate(-8deg);margin-left:4px;display:inline-block}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.tagline{font-size:13px;line-height:1.3;color:var(--muted);max-width:30ch;border-left:1px solid var(--line);padding-left:14px}
.tagline b{color:var(--ink)}
@media (max-width:640px){.tagline{font-size:11px;max-width:22ch;padding-left:10px}.nav .btn{display:none}}
.nav-links{display:flex;gap:22px}
.nav-links button{background:none;border:0;cursor:pointer;font:700 15px/1 var(--body);color:var(--muted);padding:6px 0}
.nav-links button:hover{color:var(--ink)}
.nav .btn{padding:12px 18px;font-size:15px;box-shadow:0 4px 0 #8FB31A}
@media (max-width:1100px){.nav-links{display:none}}

.hero{padding-block:56px 0;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:start}
@media (max-width:920px){.hero{grid-template-columns:1fr}}
.hero-copy{display:flex;flex-direction:column;gap:24px}
.hero h1{font-size:clamp(38px,6.2vw,76px);line-height:1;font-weight:800}
.hero h1 .tape{display:inline-block;background:var(--lime);color:var(--lime-ink);padding:0 .14em;transform:rotate(-2deg);margin-top:.1em}
.spray{font:800 clamp(18px,2.4vw,24px)/1.15 var(--display);color:var(--lime-ink);background:var(--hot);padding:10px 16px;border-radius:6px;transform:rotate(-2.5deg);display:inline-block;align-self:flex-start;box-shadow:4px 4px 0 rgba(0,0,0,.45);text-transform:uppercase;letter-spacing:.01em}
.spray::before{content:'★ '}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700}
.chip b{color:var(--lime)}

.card-form{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;position:relative;scroll-margin-top:90px}
.card-form .sticker{position:absolute;top:-16px;right:18px;background:var(--hot);color:var(--lime-ink);font:800 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;border-radius:8px;transform:rotate(4deg)}
.card-form form{display:flex;flex-direction:column;gap:18px}
.card-form h3{font-size:22px}
.sub{color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field label,.field .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.field input,.field select{font:600 17px/1.2 var(--body);color:var(--ink);background:var(--ground);border:2px solid var(--line);border-radius:12px;padding:14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--lime);outline:none}
.field input[aria-invalid="true"]{border-color:var(--hot)}
.err{color:var(--hot);font-size:13px;font-weight:700}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ages input{position:absolute;opacity:0;pointer-events:none}
.ages label{display:flex;align-items:center;justify-content:center;height:48px;border:2px solid var(--line);border-radius:12px;font:800 17px/1 var(--display);color:var(--ink);cursor:pointer}
.ages input:checked+label{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.ages input:focus-visible+label{outline:3px solid var(--hot);outline-offset:2px}
.card-form .btn{width:100%}
.fine{font-size:13px;color:var(--muted);text-align:center}
.done{display:flex;flex-direction:column;gap:14px}
.done pre,.pitch pre{white-space:pre-wrap;background:var(--ground);border:1px dashed var(--line);border-radius:12px;padding:14px;font:600 14px/1.5 var(--body);margin:0;color:var(--ink);user-select:all}
.done .row{display:flex;gap:10px;flex-wrap:wrap}
.done .row .btn{flex:1 1 180px;padding:16px 18px;font-size:15px}

.dialog{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.dialog{grid-template-columns:1fr}}
.bubble{border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px;font-size:18px;font-weight:700;line-height:1.35;background:var(--panel2)}
.bubble small{font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.bubble.b2{color:var(--muted)}
.bubble.us{background:var(--lime);color:var(--lime-ink)}

.picker{display:grid;grid-template-columns:280px 1fr;gap:20px}
@media (max-width:820px){.picker{grid-template-columns:1fr}}
.tabs{display:flex;flex-direction:column;gap:8px}
@media (max-width:820px){.tabs{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.tab{flex:0 0 auto;text-align:left;font:700 16px/1.2 var(--body);color:var(--muted);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--lime-ink);background:var(--lime);border-color:var(--lime)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:700px){.panel{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px}
.k{font:800 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.v{font-size:19px;font-weight:700;line-height:1.35}
.panel .quote{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:16px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cards.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1000px){.cards.c4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.cards,.cards.c4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:10px}
.card .n{font:800 44px/1 var(--display);color:var(--lime)}
.card p{color:var(--muted);font-size:16px}
.card .when{margin-top:auto;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.card .m{font:700 18px/1.3 var(--display);color:var(--muted)}
.card .m s{text-decoration-color:var(--hot);text-decoration-thickness:3px}
.card .ic{font:800 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--hot)}

.compare{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.compare>div{padding:26px}
.compare .old{background:var(--panel)}
.compare .new{background:var(--panel2)}
.compare .hd{font:800 14px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.compare .old .hd{color:var(--muted)}
.compare .new .hd{color:var(--lime)}
.compare .it{padding:14px 0;border-top:1px solid var(--line);font-size:17px;font-weight:600;min-height:56px}
.compare .old .it{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--hot)}
@media (max-width:640px){.compare .it{font-size:15px}.compare>div{padding:18px}}

.report{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px}
@media (max-width:820px){.report{grid-template-columns:1fr}}
.phone{background:var(--ground);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:380px;width:100%;justify-self:center}
.msg{background:var(--panel2);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:15px;line-height:1.5}
.msg .t{font-size:12px;color:var(--muted);margin-top:4px;text-align:right}
.msg b{color:var(--lime)}

.road{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:22px;overflow:hidden}
@media (max-width:900px){.road{grid-template-columns:1fr}}
.road>div{padding:24px;background:var(--panel);display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line)}
.road>div:last-child{border-right:0;background:var(--panel2)}
@media (max-width:900px){.road>div{border-right:0;border-bottom:1px solid var(--line)}}
.road .mo{font:800 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--hot)}
.road p{color:var(--muted);font-size:15px}
.outcomes{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}

.format{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.format{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.format{grid-template-columns:1fr}}
.fmt{border-top:3px solid var(--lime);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.fmt .big{font:800 30px/1 var(--display)}
.fmt p{color:var(--muted);font-size:15px}
.dict{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
.dict span{font-size:15px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.dict s{color:var(--muted)}

.pitch{display:grid;grid-template-columns:1fr 1fr;gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px}
@media (max-width:820px){.pitch{grid-template-columns:1fr}}
.pitch ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px;font-weight:600}
.pitch .side{display:flex;flex-direction:column;gap:12px}

.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.prices{grid-template-columns:1fr}}
.price{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;position:relative}
.price.hotp{border:2px solid var(--lime)}
.price .tag{position:absolute;top:-13px;left:24px;background:var(--lime);color:var(--lime-ink);font:800 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:6px}
.price .name{font:800 26px/1 var(--display)}
.price .amt{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.price .amt small{font:600 15px/1 var(--body);color:var(--muted)}
.price ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:15px}
.price li{padding-left:24px;position:relative}
.price li::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:12px;background:var(--lime);border-radius:3px;transform:rotate(12deg)}
.price .btn{margin-top:auto}
.guarantee{margin-top:18px;display:flex;gap:18px;align-items:center;background:var(--panel2);border-radius:18px;padding:20px 24px}
.seal{flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:3px dashed var(--lime);display:flex;align-items:center;justify-content:center;font:800 13px/1.1 var(--display);color:var(--lime);text-align:center;transform:rotate(-8deg)}

.faq{display:flex;flex-direction:column;gap:10px;max-width:860px}
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 22px}
summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:800;font-size:18px;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:800 24px/1 var(--display);color:var(--lime);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding-bottom:20px;color:var(--muted);font-size:16px;max-width:68ch}

.final{margin-top:72px;background:var(--lime);color:var(--lime-ink);border-radius:28px;padding:48px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:20px;position:relative;overflow:hidden}
.final h2{font-size:clamp(32px,5.4vw,60px);max-width:18ch}
.final p{font-size:18px;font-weight:600;max-width:52ch}
.final .eyebrow{color:var(--lime-ink)}
.final .btn{background:var(--ground);color:var(--ink);box-shadow:0 6px 0 #000}
.big17{position:absolute;right:-20px;bottom:-60px;font:800 280px/1 var(--display);color:rgba(17,18,20,.08);pointer-events:none;transform:rotate(-8deg)}
@media (max-width:640px){.big17{font-size:180px;bottom:-30px}}
footer{margin-top:40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(17,18,20,.94);border-top:1px solid var(--line);display:none}
.sticky .btn{width:100%;padding:16px}
@media (max-width:920px){.sticky.on{display:block}}

.manifesto{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:12px}
.manifesto p{font:800 clamp(20px,2.6vw,30px)/1.25 var(--display)}
.manifesto p.dim{color:var(--muted)}
.manifesto p.last{color:var(--lime);font-size:clamp(28px,4vw,44px);margin-top:10px}
.src{margin-top:14px;font-size:13px;color:var(--muted)}
.hub-group{grid-column:1/-1;margin-top:18px;font:800 13px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.about{display:grid;grid-template-columns:1fr;gap:14px}
@media (max-width:900px){.about{grid-template-columns:1fr}}
.about-main{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:18px}
.about-main .def{font:800 clamp(22px,2.6vw,30px)/1.25 var(--display)}
.about-main .def mark{background:var(--lime);color:var(--lime-ink);padding:0 .15em}
.nots{display:flex;flex-wrap:wrap;gap:8px}
.nots span{font-size:14px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:6px 12px}
.nots span s{text-decoration-color:var(--hot);text-decoration-thickness:2px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.why{grid-template-columns:1fr}}
.why div{border-top:3px solid var(--hot);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.why b{font:800 22px/1 var(--display)}
.why p{color:var(--muted);font-size:15px}
.team{display:flex;flex-direction:column;gap:14px}
.person{background:var(--panel2);border-radius:20px;padding:22px;display:flex;gap:16px;align-items:flex-start}
.ava{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;font:800 22px/1 var(--display)}
.person h3{font-size:18px}
.person .role{font:800 12px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--hot);margin:4px 0 8px}
.person p{color:var(--muted);font-size:15px}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;font-weight:700}
.mission span{display:block;font:800 12px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
.mood{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:190px;gap:12px}
.mood figure{margin:0;position:relative;overflow:hidden;border-radius:16px;background:var(--panel)}
.mood figure:first-child{grid-row:span 2}
.mood figure:last-child{grid-column:1/-1}
.mood img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.08) saturate(1.05)}
.mood figcaption{position:absolute;left:12px;bottom:12px;background:var(--lime);color:var(--lime-ink);font:800 14px/1 var(--display);padding:7px 10px;transform:rotate(-2deg);text-transform:uppercase}
@media (max-width:820px){.mood{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.mood figure:first-child{grid-column:span 2}}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:700px){.dodont{grid-template-columns:1fr}}
.dodont div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:15px;color:var(--muted)}
.dodont b{display:block;font:800 14px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px}
.sw i{width:24px;height:24px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.mood .gate{container-type:inline-size}
.mood .gate img{object-position:center 60%}
.g-word{position:absolute;left:12%;top:52%;font:400 14cqw/1 'Rubik Spray Paint',var(--display);color:#F4F2EC;transform:rotate(-5deg);text-shadow:0 0 .8cqw rgba(0,0,0,.4)}
.g-blob{position:absolute;left:63%;top:47%;width:30%;height:34%;background:var(--lime);border-radius:46% 38% 52% 34%;filter:blur(1.5px);transform:rotate(-4deg)}
.g-num{position:absolute;left:68%;top:48%;font:400 22cqw/1 'Rubik Spray Paint',var(--display);color:#111214;transform:rotate(6deg)}
.ages{position:relative}
.ages input{left:0;top:0;width:1px;height:1px}
/* founders */
.crew{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
@media (max-width:960px){.crew{grid-template-columns:1fr}}
.poster{margin:0;display:flex;flex-direction:column;gap:10px;position:sticky;top:90px}
@media (max-width:960px){.poster{position:static}}
.poster svg{display:block;width:100%;height:auto;max-width:100%;border-radius:22px;border:1px solid var(--line);background:#16181D}
.poster figcaption{font-size:13px;color:var(--muted)}
.poster .ink{stroke:#F4F2EC;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.poster .head{fill:#F4F2EC}
.poster .gtr{fill:var(--hot)}
.poster .gtr2{fill:var(--lime)}
.poster .neck{fill:#F4F2EC}
.poster .burst{fill:var(--lime);opacity:.16}
.poster .burst2{fill:var(--hot);opacity:.9}
.poster .ramp{fill:var(--lime)}
.poster .card{fill:#22252B;stroke:#F4F2EC;stroke-width:2.5}
.poster .ct{font:800 15px var(--display);fill:#F4F2EC}
.poster .ct2{font:800 22px var(--display);fill:#111214}
.poster .rt{font:800 20px var(--display);fill:#111214;letter-spacing:.02em}
.poster .spd{stroke:#F4F2EC;stroke-width:3;stroke-linecap:round;opacity:.5}
.poster .fly{animation:fly 3.2s ease-in-out infinite}
.poster .fly.d2{animation-delay:-1.1s}.poster .fly.d3{animation-delay:-2.2s}
@keyframes fly{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.founders{display:flex;flex-direction:column;gap:18px}
.fnd{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px}
.fnd .who{display:flex;align-items:center;gap:14px}
.fnd .fava{flex:0 0 auto;width:56px;height:56px;border-radius:14px;background:var(--lime);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;font:800 22px/1 var(--display);transform:rotate(-4deg)}
.fnd .fava.b{background:var(--hot)}
.fnd .nm{font:800 22px/1.15 var(--display)}
.fnd .rl{font-size:14px;font-weight:700;color:var(--muted)}
.fnd .hook{font:700 19px/1.35 var(--body);color:var(--ink)}
.fnd ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--muted)}
.fnd li{padding-left:22px;position:relative}
.fnd li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:3px;background:var(--lime);transform:rotate(12deg)}
.fnd li b{color:var(--ink)}
.fnd .inclub{border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.fnd .inclub span{color:var(--lime);font-weight:800}
.trust{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:960px){.trust{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.trust{grid-template-columns:1fr}}
.trust div{border-top:3px solid var(--hot);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.trust b{font:800 17px/1.25 var(--display)}
.trust span{font-size:15px;color:var(--muted)}
.manifest{margin-top:22px;font:800 clamp(22px,3vw,32px)/1.25 var(--display);max-width:30ch;text-wrap:balance}
.manifest em{font-style:normal;background:var(--lime);color:var(--lime-ink);padding:0 .15em}


/* v7 */
.duo{display:flex;flex-wrap:wrap;gap:10px}
.duo span{display:inline-flex;align-items:center;gap:10px;background:var(--panel2);border-radius:999px;padding:6px 16px 6px 6px;font-size:15px;font-weight:700}
.duo i{font:800 16px/1 var(--display);font-style:normal;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--lime);color:var(--lime-ink)}
.duo span+span i{background:var(--hot)}
.duo small{color:var(--muted);font-weight:600;font-size:14px}
.rtb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.rtb{grid-template-columns:1fr}}
.rtb div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.rtb b{font:800 17px/1.25 var(--display)}
.rtb span{font-size:15px;color:var(--muted)}
.crewside{display:flex;flex-direction:column;gap:18px}
.gvai{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.gvai{grid-template-columns:1fr}}
.gpane{border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.gpane.g{background:var(--panel)}
.gpane.a{background:var(--panel2);border:2px solid var(--lime)}
.gpane .lbl{font:800 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gpane.a .lbl{color:var(--lime)}
.sbox{border:2px solid var(--line);border-radius:999px;padding:12px 18px;font-weight:700;color:var(--ink)}
.res{display:flex;flex-direction:column;gap:10px}
.res span{display:block;color:#8AB4F8;font-weight:700;font-size:15px}
.res small{display:block;color:var(--muted);font-size:13px}
.ask{align-self:flex-end;background:var(--ground);border-radius:16px 16px 4px 16px;padding:12px 16px;font-weight:700;max-width:90%}
.did{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.did li{background:var(--ground);border-radius:12px;padding:10px 14px 10px 40px;position:relative;font-weight:600;font-size:15px}
.did li::before{content:"✓";position:absolute;left:14px;top:9px;color:var(--lime);font-weight:800}
.gpane .foot{margin-top:auto;font:800 18px/1.2 var(--display)}
.gpane.g .foot{color:var(--muted)}
.gpane.a .foot{color:var(--lime)}
.punch{margin-top:22px;font:800 clamp(26px,4vw,44px)/1.1 var(--display)}
.punch em{font-style:normal;background:var(--lime);color:var(--lime-ink);padding:0 .15em}
.edge{background:var(--hot);color:var(--lime-ink);border-radius:28px;padding:40px 32px;display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center}
@media (max-width:860px){.edge{grid-template-columns:1fr}}
.edge h2{font-size:clamp(30px,4.6vw,52px)}
.edge p{font-size:17px;font-weight:600;max-width:52ch;margin-top:14px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-direction:column;gap:6px}
.bar b{font:800 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
.bar div{background:rgba(17,18,20,.9);color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
.bar.lo div{width:38%;min-width:150px;background:rgba(17,18,20,.35);color:var(--lime-ink)}
.pop{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
@media (max-width:900px){.pop{grid-template-columns:1fr}}
.stat{background:var(--lime);color:var(--lime-ink);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:10px}
.stat .big{font:800 clamp(44px,5vw,60px)/1 var(--display)}
.stat p{font-weight:600;font-size:15px}
.stat .n2{font:800 34px/1 var(--display);margin-top:10px;border-top:2px solid rgba(17,18,20,.25);padding-top:14px}
.ptrack{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px;position:relative}
.ptrack .tag{align-self:flex-start;background:var(--hot);color:var(--lime-ink);font:800 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:6px}
.ptrack h3{font-size:26px}
.ptrack p{color:var(--muted);font-size:15px}
.ptrack .earn{color:var(--ink);font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.trialcard{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;background:var(--panel2);border:3px solid var(--lime);border-radius:26px;padding:30px;position:relative}
@media (max-width:820px){.trialcard{grid-template-columns:1fr}}
.trialcard .tag{position:absolute;top:-15px;left:26px;background:var(--hot);color:var(--lime-ink);font:800 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:6px;transform:rotate(-2deg)}
.trialcard h3{font-size:26px}
.tprice{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-top:8px}
.tprice s{font:800 clamp(28px,4vw,40px)/1 var(--display);color:var(--muted);text-decoration-color:var(--hot);text-decoration-thickness:5px}
.tprice b{font:800 clamp(64px,9vw,104px)/.9 var(--display);color:var(--lime)}
.tprice small{flex-basis:100%;font-size:13px;color:var(--muted)}
.trialcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:16px;font-weight:600}
.trialcard li{padding-left:24px;position:relative}
.trialcard li::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:12px;background:var(--lime);border-radius:3px;transform:rotate(12deg)}
.trialcard .btn{margin-top:18px;width:100%}
.then{margin:36px 0 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.then h3{font-size:22px}
.then span{color:var(--muted);font-size:15px}
.price .free{align-self:flex-start;font-size:13px;font-weight:800;color:var(--lime);border:1px dashed var(--lime);border-radius:999px;padding:5px 10px}
.price .amt{font-size:28px}
.mood .rel{background:var(--panel2);display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 18px 18px 110px;flex-wrap:wrap}
.mood .rel .t{border-radius:14px;padding:14px 16px;font:800 14px/1.15 var(--display);color:var(--lime-ink);min-width:130px;height:110px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.mood .rel .t small{font:700 11px/1.2 var(--body);opacity:.75;text-transform:none}
.mood .rel span.t:nth-of-type(1){background:var(--lime);transform:rotate(-4deg)}
.mood .rel span.t:nth-of-type(2){background:#FF5FA2;transform:rotate(3deg)}
.mood .rel span.t:nth-of-type(3){background:#5CD3FF;transform:rotate(-2deg)}
.mood .rel span.t:nth-of-type(4){background:#FFB84D;transform:rotate(4deg)}
.mood .rel figcaption{top:12px;bottom:auto}
@media (max-width:820px){.mood .rel{grid-row:span 2;padding:48px 12px 12px}.mood .rel .t{min-width:0;flex:1 1 40%;height:90px}}

.poster.wide{position:static;max-width:920px}
.who-h{margin:40px 0 18px;font-size:clamp(22px,2.6vw,30px)}
.rtb.rtb{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.rtb.rtb{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.rtb.rtb{grid-template-columns:1fr}}
.rtb .feat{grid-column:span 2;background:var(--lime);border-color:var(--lime)}
.rtb .feat b{font-size:22px;color:var(--lime-ink)}
.rtb .feat span{color:var(--lime-ink);font-weight:600;font-size:16px}
@media (max-width:560px){.rtb .feat{grid-column:auto}}
.urg{background:var(--ground);border:2px solid var(--hot);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.urg-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.urg b{font-size:16px}
.urg .dots{display:flex;gap:5px}
.urg .dots span{width:14px;height:14px;border-radius:4px;border:2px solid var(--lime)}
.urg .dots span.busy{background:var(--muted);border-color:var(--muted);opacity:.5}
.urg .cd{font-size:14px;color:var(--muted)}
.urg #cdown{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
/* hub */
.hub-head{padding-block:56px 36px;display:flex;flex-direction:column;gap:16px}
.hub-head h1{font-size:clamp(34px,5vw,60px);line-height:1.05;font-weight:800}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:820px){.hub{grid-template-columns:1fr}}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:16px;border-top:6px solid var(--c)}
.hcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hcard .code{font:800 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.hcard h2{font-size:24px}
.hcard .h1{font:800 20px/1.2 var(--display);color:var(--ink)}
.hcard dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:15px}
.hcard dt{color:var(--muted);font-weight:700}
.hcard dd{margin:0}
.hcard .btn{align-self:flex-start;padding:14px 20px;font-size:15px}
.note{margin-top:28px;background:var(--panel2);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:15px}
.note b{color:var(--ink)}
</style>

    return '<header class="hero"><div class="hero-copy"><p class="eyebrow">'+esc(v.eyebrow)+'</p>'+

      '<p class="lead">'+esc(v.lead)+'</p><span class="spray">'+esc(v.spray)+'</span>'+
      '<div class="facts">'+v.chips.map(function(c){return '<span class="chip">'+(c[0]?'<b>'+esc(c[0])+'</b> ':'')+c[1]+'</span>'}).join('')+'</div></div>'+
      '<div class="card-form" id="signup"><span class="sticker">Бесплатно</span>'+
      '<div id="formView"><form id="leadForm" novalidate>'+
        '<div style="display:flex;flex-direction:column;gap:6px"><h3>'+esc(f.title)+'</h3><p class="sub">'+esc(f.sub)+'</p></div>'+
        '<div class="field"><span class="lbl" id="ageLbl">'+(v.teen?'Сколько тебе лет':'Сколько лет ребенку')+'</span><div class="ages" role="radiogroup" aria-labelledby="ageLbl" style="grid-template-columns:repeat('+ages.length+',1fr)">'+
          ages.map(function(a){return '<input type="radio" name="age" id="age'+a+'" value="'+a+'"'+(a===def?' checked':'')+'><label for="age'+a+'">'+a+'</label>'}).join('')+'</div></div>'+
        (f.hideHobby?'':'<div class="field"><label for="hobbySel">'+(v.teen?'Чем увлекаешься':'Чем увлекается')+'</label><select id="hobbySel">'+HOBBIES.map(function(h){return '<option>'+esc(h.name)+'</option>'}).join('')+'<option>'+(v.teen?'Пока не знаю':'Пока не знаем')+'</option></select></div>')+
        (f.country?'<div class="field"><label for="countryIn">Страна и город</label><input id="countryIn" placeholder="Сербия, Белград" autocomplete="country-name"></div>':'')+
        '<div class="field"><label for="nameIn">'+esc(f.name)+'</label><input id="nameIn" autocomplete="name" placeholder="'+esc(f.namePh)+'"><span class="err" id="nameErr" hidden>Напиши'+(v.teen?'':'те')+' имя, чтобы мы знали, как обратиться</span></div>'+
        '<div class="field"><label for="contactIn">'+esc(f.contact)+'</label><input id="contactIn" autocomplete="tel" placeholder="@username или +7 999 123-45-67"><span class="err" id="contactErr" hidden>Нужен ник в Telegram или номер телефона</span></div>'+
        '<div class="urg" aria-live="polite"><div class="urg-top"><span class="dots">'+Array.apply(null,Array(SEATS_TOTAL)).map(function(_,i){return '<span'+(i<SEATS_TOTAL-SEATS_LEFT?' class="busy"':'')+'></span>'}).join('')+'</span><b>Осталось '+SEATS_LEFT+' '+(SEATS_LEFT===1?'бесплатное место':'бесплатных места')+' в группе</b></div><div class="cd">Запись на пробные уроки этой недели закроется через <span id="cdown">…</span></div></div>'+
        '<button class="btn btn-lime" type="submit">'+esc(f.submit)+'</button>'+
        '<p class="fine">'+(v.teen?'Бесплатно. Никаких карт и оплат.':'Без оплаты и привязки карты. Пробный урок ни к чему не обязывает.')+'</p>'+
      '</form></div>'+
      '<div id="sentView" class="done" hidden><h3>'+(v.teen?'Заявка отправлена!':'Заявка отправлена!')+'</h3><p class="sub">'+(v.teen?'Напишем тебе в Telegram в течение дня и договоримся о времени.':'Напишем вам в течение дня и подберем удобное время.')+'</p><p class="sub">'+(v.teen?'А пока подумай, какого бота хочешь собрать первым.':'Если есть вопрос, просто ответьте на наше сообщение.')+'</p></div>'+
      '<div id="doneView" class="done" hidden><h3>Заявка готова</h3><p class="sub">Остался один шаг: отправ'+(v.teen?'ь':'ьте')+' ее нам в Telegram. Скопируй'+(v.teen?'':'те')+' текст и открой'+(v.teen?'':'те')+' чат.</p><pre id="leadText"></pre>'+
        '<div class="row"><button class="btn btn-ghost" type="button" id="copyBtn">Скопировать</button><a class="btn btn-lime" id="tgBtn" href="https://t.me/'+TG+'" target="_blank" rel="noopener">Открыть Telegram</a></div>'+
        '<p class="fine">Наш Telegram: @'+TG+'</p><button class="btn btn-ghost" type="button" id="editBtn" style="padding:12px">Изменить заявку</button></div>'+
      '</div></header>';
  }

  function nav(v){
    var links=v?v.sections.filter(function(s){return NAVLBL[s]}).slice(0,5).map(function(s){return '<button type="button" data-go="s-'+s+'">'+NAVLBL[s]+'</button>'}).join(''):'';
    return '<nav class="nav" aria-label="Навигация"><div class="wrap"><div class="brand"><button class="logo" type="button" data-go="top" aria-label="Гараж17, наверх"><b>ГАРАЖ</b><i>17</i></button><span class="tagline"><b>Онлайн-клуб для ребят 13-17 лет.</b> Строим с ИИ сайты, ботов и свои проекты</span></div><div class="nav-links">'+links+'</div>'+
      (v?'<button class="btn btn-lime" type="button" data-go="signup">'+(v.teen?'Хочу собрать бота':'Записаться')+'</button>':'')+'</div></nav>';
  }

  function renderVariant(v){
    document.body.setAttribute('data-v',v.code);
    document.title='Гараж17 · '+v.label;
    var html=nav(v)+'<main class="wrap" id="top">'+hero(v)+v.sections.map(function(s){return S[s](v)}).join('')+
      '<footer><span>Гараж17 · клуб молодых создателей</span><span>Сделано в Гараж17</span></footer></main>';
    document.getElementById('app').innerHTML=html;
    document.getElementById('stickyBtn').textContent=v.form.submit+(v.price==='eur'?' · 0 €':' · 0 ₽');
    bindVariant(v);
  }

  function renderHub(){
    document.body.removeAttribute('data-v');
    document.title='Лендинги Гараж17';
    var html=nav(null)+'<main class="wrap" id="top"><header class="hub-head"><p class="eyebrow">Гараж17 · запись на пробный урок</p><h1>Восемь лендингов: четыре аудитории и четыре инсайта</h1><p class="lead">Оффер везде один: бесплатный пробный урок, 60 минут, первый бот в тот же вечер. Меняются герой, боль, аргументы, порядок блоков и валюта. Каждая версия открывается по своей ссылке, на нее ведем отдельную рекламу.</p></header><div class="hub">'+
      ORDER.map(function(k,idx){var v=V[k];return (idx===0?'<p class="hub-group">Под аудитории</p>':idx===4?'<p class="hub-group">Под инсайты: те же мамы и подростки, другой крючок</p>':'')+'<article class="hcard" style="--c:'+v.color+'"><div class="top"><span class="code">#'+k+'</span><span class="chip">'+esc(v.label)+'</span></div><p class="h1">'+esc(v.h1)+' '+esc(v.tape)+'</p>'+
        '<dl><dt>Кто</dt><dd>'+esc(v.audience)+'</dd><dt>Боль</dt><dd>'+esc(v.pain)+'</dd><dt>Главный аргумент</dt><dd>'+esc(v.spray)+'</dd><dt>Каналы</dt><dd>'+esc(v.channels)+'</dd><dt>Блоки</dt><dd>'+v.sections.filter(function(s){return s!=='final'}).map(function(s){return ({dialog:'диалог',about:'кто мы',team:'основатели',google:'гугл vs ИИ',edge:'на голову выше',popular:'дизайн и контент',mood:'атмосфера',future:'что меняется',hold:'почему не бросают',ideas:'первые релизы',manifesto:'манифест',hobby:'выбор хобби',trial:'пробный урок',compare:'сравнение',myths:'мифы про ИИ',report:'отчет родителям',format:'формат',price:'цены',faq:'вопросы',pitch:'как уговорить родителей',whyru:'почему на русском',tracks:'треки',road:'программа Фаундер'})[s]}).join(' → ')+'</dd></dl>'+
        '<a class="btn btn-lime" href="#'+k+'">Открыть лендинг</a></article>'}).join('')+
      '</div><section aria-labelledby="hubMoodH"><div class="sec-head"><p class="eyebrow">Мудборд</p><h2 id="hubMoodH">Как выглядит Гараж17</h2><p class="lead">Гаражный андеграунд: ночь, неон, скорость, стикеры и изолента. Фото с Pexels только как референс настроения, для запуска снимаем своих учеников.</p></div>'+moodGrid()+'<div class="swatches"><span class="sw"><i style="background:#C6F135"></i>Неон-лайм #C6F135</span><span class="sw"><i style="background:#16181D"></i>Графит #16181D</span><span class="sw"><i style="background:#FF5A36"></i>Стоп-сигнал #FF5A36</span><span class="sw"><i style="background:#E4E1D8"></i>Бетон #E4E1D8</span><span class="sw">Шрифты: Unbounded + Manrope</span></div>'+'<div class="dodont"><div><b style="color:var(--lime)">Да</b>Реальные ученики, ночь и неон, изолента-плашки, стикеры, скриншоты кода и проектов, зерно, сырое видео с телефона, юмор</div><div><b style="color:#FF5A36">Нет</b>Стоковые улыбающиеся дети, пастель, школьная доска и глобус, глянец, дети в костюмах «бизнесменов», музыкальные инструменты и сцена</div></div></section>'+'<div class="note"><b>Как тестировать</b><span>Одинаковый бюджет на каждую версию, сравниваем цену заявки и долю записавшихся, кто дошел до пробного урока. В тексте каждой заявки стоит метка лендинга, так видно, откуда пришел человек.</span><span>Инсайтные версии тестируем против базовых: #future и #quit против #mama, #status и #rebel против #teen. Побеждает крючок с меньшей ценой записи на пробный урок.</span><span>Цены в евро для «#abroad»: €119 взято из бренд-плана, €69 и €229 пересчитаны пропорционально. Все цены пока гипотеза для теста.</span></div></main>';
    document.getElementById('app').innerHTML=html;
    document.getElementById('sticky').classList.remove('on');
  }

  function bindVariant(v){
    var tabs=document.getElementById('tabs'),panel=document.getElementById('panel');
    if(tabs){
      var show=function(i){var h=HOBBIES[i];
        Array.prototype.forEach.call(tabs.children,function(b,j){b.setAttribute('aria-selected',j===i?'true':'false');b.tabIndex=j===i?0:-1});
        panel.innerHTML='<div class="col"><span class="k">Что построишь с ИИ</span><span class="v">'+esc(h.build)+'</span></div><div class="col"><span class="k">Какой навык</span><span class="v">'+esc(h.skill)+'</span></div><div class="col"><span class="k">Как заработать</span><span class="v">'+esc(h.money)+'</span></div><p class="quote">'+esc(h.q)+'</p>';};
      HOBBIES.forEach(function(h,i){var b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.textContent=h.name;
        b.addEventListener('click',function(){show(i);var sel=document.getElementById('hobbySel');if(sel)sel.value=h.name});
        b.addEventListener('keydown',function(e){var n=null;if(e.key==='ArrowDown'||e.key==='ArrowRight')n=(i+1)%HOBBIES.length;if(e.key==='ArrowUp'||e.key==='ArrowLeft')n=(i-1+HOBBIES.length)%HOBBIES.length;if(n!==null){e.preventDefault();show(n);tabs.children[n].focus()}});
        tabs.appendChild(b)});
      show(0);
    }
    if(window.__g17cd)clearInterval(window.__g17cd);
    var cdEl=document.getElementById('cdown');
    function tick(){if(!document.body.contains(cdEl)){clearInterval(window.__g17cd);return}
      var n=new Date(),e=new Date(n);e.setDate(n.getDate()+((7-n.getDay())%7));e.setHours(23,59,59,999);
      var ms=Math.max(0,e-n),d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,sec=Math.floor(ms/1e3)%60;
      function z(x){return (x<10?'0':'')+x}
      cdEl.textContent=(d?d+' '+(d===1?'день':d<5?'дня':'дней')+' ':'')+z(h)+':'+z(m)+':'+z(sec);}
    if(cdEl){tick();window.__g17cd=setInterval(tick,1000);}
    var form=document.getElementById('leadForm'),fv=document.getElementById('formView'),dv=document.getElementById('doneView'),nameIn=document.getElementById('nameIn'),contactIn=document.getElementById('contactIn');
    function setErr(inp,id,bad){inp.setAttribute('aria-invalid',bad?'true':'false');document.getElementById(id).hidden=!bad}
    function okC(s){s=s.trim();return /^@?[A-Za-z0-9_]{5,32}$/.test(s)||s.replace(/\D/g,'').length>=10}
    nameIn.addEventListener('input',function(){if(nameIn.value.trim())setErr(nameIn,'nameErr',false)});
    contactIn.addEventListener('input',function(){if(okC(contactIn.value))setErr(contactIn,'contactErr',false)});
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var a=!!nameIn.value.trim(),c=okC(contactIn.value);setErr(nameIn,'nameErr',!a);setErr(contactIn,'contactErr',!c);
      if(!a){nameIn.focus();return}if(!c){contactIn.focus();return}
      var age=(form.querySelector('input[name=age]:checked')||{}).value||'',hs=document.getElementById('hobbySel'),ci=document.getElementById('countryIn');
      var lines=[(v.teen?'Привет! Хочу на бесплатное занятие в Гараж17.':'Здравствуйте! Хочу записать ребенка на пробный урок в Гараж17.'),'Имя: '+nameIn.value.trim(),'Возраст: '+age];
      if(hs)lines.push('Хобби: '+hs.value);if(ci&&ci.value.trim())lines.push('Страна: '+ci.value.trim());
      lines.push('Контакт: '+contactIn.value.trim(),'Лендинг: '+v.code);
      document.getElementById('leadText').textContent=lines.join('\n');
      function show(el){fv.hidden=true;el.hidden=false;document.getElementById('signup').scrollIntoView({block:'start'})}
      if(!ENDPOINT){show(dv);return}
      var btn=form.querySelector('button[type=submit]'),label=btn.textContent;btn.disabled=true;btn.textContent='Отправляем...';
      var q={};try{new URLSearchParams(location.search).forEach(function(val,k){q[k]=val})}catch(_){}
      var data={variant:v.code,name:nameIn.value.trim(),age:age,hobby:hs?hs.value:'',country:ci?ci.value.trim():'',contact:contactIn.value.trim(),utm:q,ref:document.referrer||'',page:location.href};
      fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
        .then(function(r){if(!r.ok)throw new Error('http '+r.status);show(document.getElementById('sentView'))})
        .catch(function(){btn.disabled=false;btn.textContent=label;show(dv)});
    });
    document.getElementById('editBtn').addEventListener('click',function(){dv.hidden=true;fv.hidden=false;nameIn.focus()});
    copyInto('copyBtn','leadText');
    if(document.getElementById('copyParent'))copyInto('copyParent','parentMsg');
    var sticky=document.getElementById('sticky');sticky.classList.add('on');
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(en){sticky.classList.toggle('on',!en.isIntersecting)})},{threshold:.2}).observe(document.getElementById('signup'))}
  }
  function copyInto(btnId,srcId){
    var b=document.getElementById(btnId);
    b.addEventListener('click',function(){var el=document.getElementById(srcId);
      function fb(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Выделено, нажмите Ctrl+C'}
      try{navigator.clipboard.writeText(el.textContent).then(function(){b.textContent='Скопировано'},fb)}catch(e){fb()}});
  }

  // in-page scrolling without touching the hash (hash selects the variant)
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-go]');if(!t)return;e.preventDefault();
    var id=t.getAttribute('data-go');
    if(id==='top'){window.scrollTo({top:0,behavior:'smooth'});return}
    var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    if(id==='signup'){var n=document.getElementById('nameIn');if(n)setTimeout(function(){n.focus({preventScroll:true})},400)}
  });

  function route(){var k=(location.hash||'').slice(1),def=window.G17_DEFAULT;if(V[k])renderVariant(V[k]);else if(def&&V[def]&&k!=='hub')renderVariant(V[def]);else renderHub();window.scrollTo(0,0)}
  window.addEventListener('hashchange',route);
  route();
})();
</script>
